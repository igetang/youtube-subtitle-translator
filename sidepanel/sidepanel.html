<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>翻译设置</title>
    <link rel="stylesheet" href="sidepanel.css">
</head>
<body>
    <h1>翻译设置</h1>

    <div class="setting-item">
        <label for="source-language">源语言:</label>
        <select id="source-language" name="source-language">
            <!-- 添加常用语言选项 -->
            <option value="en">英语 (自动检测)</option> 
            <option value="ja">日语</option>
            <option value="ko">韩语</option>
            <option value="zh-CN">中文 (简体)</option>
            <option value="es">西班牙语</option>
        </select>
    </div>

    <div class="setting-item">
        <label for="target-language">目标语言:</label>
        <select id="target-language" name="target-language">
            <!-- 更新为指定的主流语言列表 -->
            <option value="zh-CN">中文 (简体)</option>
            <option value="zh-TW">中文 (繁体)</option>
            <option value="en">英语</option>
            <option value="ja">日语</option>
            <option value="ko">韩语</option>
            <option value="es">西班牙语</option>
            <!-- 可以根据需要添加更多 -->
        </select>
    </div>

    <div class="setting-item">
        <label>字幕类型:</label>
        <div class="switch-container">
            <span>仅目标语言</span>
            <label class="switch">
                <input type="checkbox" id="subtitle-type-switch">
                <span class="slider round"></span>
            </label>
            <span>双语</span>
        </div>
    </div>

    <!-- 可以添加保存按钮等 -->
    <!-- <button id="save-settings">保存设置</button> -->

    <script type="module" src="sidepanel.js"></script> 
</body>
</html>
