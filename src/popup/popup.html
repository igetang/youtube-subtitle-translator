<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>翻译设置</title>
    <script type="module" crossorigin src="./popup.ts"></script>
    <style>
/* Popup专用样式 - 所有样式内联（符合 Google 官方 85% popup 示例的做法） */
body {
    background-color: #1a1a1a;
    color: #ffffff;
    font-family: 'YouTube Noto', Roboto, Arial, Helvetica, sans-serif;
    padding: 16px; /* 调整为16px（原CSS是15px） */
    margin: 0;
    width: 400px;
    min-height: 500px;
    max-height: 600px;
    box-sizing: border-box;
    overflow-y: auto;
}

/* 给顶级setting-item添加左右padding，和service-card内部对齐 */
body > .setting-item {
    padding: 0 15px;
}

h1 {
    text-align: center;
    font-size: 1.2em;
    margin-top: 0;
    margin-bottom: 20px;
    color: #f1f1f1;
}

.setting-item {
    margin-bottom: 18px;
    display: flex;
    flex-direction: column;
    align-items: stretch;
    gap: 8px;
}

.setting-row {
    display: flex;
    align-items: center;
    gap: 12px;
}

.setting-row > label {
    flex: 0 0 78px;  /* 固定宽度78px，不允许增长或收缩 */
    margin: 0;
    font-size: 0.9em;
    color: #c8d1dc;
    white-space: nowrap;
}

.setting-control {
    flex: 1;
    display: flex;
    align-items: center;
    gap: 8px;
}

.setting-control select,
.setting-control input,
.setting-control textarea {
    flex: 1;  /* 改为 flex: 1，和 .password-container 保持一致，确保左右对齐 */
    padding: 8px 12px;
    background-color: #333;
    color: #fff;
    border: 1px solid #555;
    border-radius: 6px;
    font-size: 0.9em;
}

.setting-control select:focus,
.setting-control input:focus,
.setting-control textarea:focus {
    outline: none;
    border-color: #fff;
}

.setting-link {
    font-size: 0.78em;
    color: #3ea6ff;
    text-decoration: none;
    white-space: nowrap;
}

.setting-link:hover {
    text-decoration: underline;
}

#api-key-panel > .setting-link {
    display: block;
    text-align: left;
    margin-left: 90px;
}

/* --- Custom Select Styles --- */
.custom-select-container {
    position: relative;
    flex: 1;
    max-width: 100%;
}

.custom-select-trigger {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 8px;
    background-color: #333;
    color: #fff;
    border: 1px solid #555;
    border-radius: 4px;
    font-size: 0.9em;
    cursor: pointer;
    user-select: none;
}

.custom-select-trigger.disabled {
    opacity: 0.6;
    background-color: #2a2a2a;
    cursor: not-allowed;
    border: 1px solid #444;
}

.custom-select-trigger .selected-value {
    overflow: hidden;
    white-space: nowrap;
    text-overflow: ellipsis;
    margin-right: 5px;
}

.custom-select-trigger .arrow {
    font-size: 0.8em;
    transition: transform 0.2s ease-in-out;
}

.custom-select-container.open .custom-select-trigger .arrow {
    transform: rotate(180deg);
}

.custom-select-panel {
    display: none;
    position: absolute;
    top: 100%;
    left: 0;
    right: 0;
    background-color: #2a2a2a;
    border: 1px solid #444;
    border-top: none;
    border-radius: 0 0 4px 4px;
    max-height: 300px !important;
    overflow-y: auto !important;
    z-index: 10;
    box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
}

.custom-select-panel input[type="search"] {
    width: calc(100% - 16px);
    padding: 8px;
    margin: 8px;
    box-sizing: border-box;
    background-color: #444;
    color: #fff;
    border: 1px solid #666;
    border-radius: 3px;
    font-size: 0.9em;
}

.custom-select-option {
    padding: 8px 12px;
    cursor: pointer;
    font-size: 0.9em;
    color: #eee;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.custom-select-option:hover {
    background-color: rgba(255, 255, 255, 0.2);
    color: #fff;
}

.custom-select-option.selected {
    background-color: #065fd4;
    color: #fff;
    font-weight: bold;
}

.custom-select-option.disabled {
    opacity: 0.5;
    color: #999 !important;
    cursor: not-allowed !important;
    background-color: #f5f5f5 !important;
}

.custom-select-option.disabled:hover {
    background-color: #f5f5f5 !important;
}

.switch-container {
    display: flex;
    align-items: center;
    gap: 12px;
}

.switch-container span {
    font-size: 0.9em;
    color: #aaa;
}

.service-card {
    background: #ffe5e5;
    border: 1px solid #27354a;
    border-radius: 16px;
    padding: 16px 0;
    display: flex;
    flex-direction: column;
    gap: 14px;
}

.service-card-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 0 15px; /* 调整为15px（原CSS是16px） */
}

.service-card-title {
    font-size: 0.95em;
    font-weight: 600;
}

.service-card-badge {
    padding: 2px 10px;
    border-radius: 999px;
    font-size: 0.75em;
    background: rgba(66, 133, 244, 0.18);
    color: #76a8ff;
}

.service-card-badge.is-free {
    background: rgba(16, 185, 129, 0.18);
    color: #32d296;
}

.service-card-body {
    display: flex;
    flex-direction: column;
    /* 删除 gap: 8px - 改用 margin-bottom 控制间距，避免 visibility: hidden 时 gap 仍然生效 */
    padding: 0 15px; /* 添加padding（原CSS没有） */
    min-height: 165px; /* 固定最小高度，确保"测试连接"按钮位置不跳动（切换服务时） */
}

.service-card .setting-item {
    margin-bottom: 8px; /* 使用 margin 而不是 gap，因为 gap 在 visibility: hidden 时仍然生效 */
}

/* === 固定布局：每个面板设置精确的固定高度 === */

/* API密钥面板：包含输入框(40px) + 链接(20px) */
#api-key-panel {
    min-height: 65px;
    box-sizing: border-box;
}

/* 模型选择面板：只有一行 */
#unified-model-panel {
    min-height: 40px;
    box-sizing: border-box;
}

/* API类型面板：只有一行，但上面有额外间距 */
#unified-tier-panel {
    min-height: 40px;
    margin-top: 2px; /* 原来是 10px，但现在已有 8px 的 margin-bottom，所以只需再加 2px */
    box-sizing: border-box;
}

/* === 固定布局：使用 visibility 控制显示/隐藏（而不是 display） === */

/* 默认隐藏所有模型选择器和tier开关 */
.model-select,
.tier-switch-container {
    display: none; /* 用 display: none 隐藏未激活的选择器 */
}

/* 显示当前激活的选择器 */
.model-select.active,
.tier-switch-container.active {
    display: block;
}

/* 使用 visibility 隐藏整行（保持占位，包括 margin 和固定高度） */
.setting-item.hidden-but-occupy {
    visibility: hidden;
    /* 保持固定的 min-height 和 margin，确保占位空间一致 */
}

.switch {
    position: relative;
    display: inline-block;
    width: 44px;
    height: 24px;
    margin: 0 10px;
}

.switch input {
    opacity: 0;
    width: 0;
    height: 0;
}

.slider {
    position: absolute;
    cursor: pointer;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    background-color: #ccc;
    transition: .4s;
}

.slider:before {
    position: absolute;
    content: "";
    height: 18px;
    width: 18px;
    left: 3px;
    bottom: 3px;
    background-color: white;
    transition: .4s;
}

input:checked + .slider {
    background-color: #2196F3;
}

input:checked + .slider:before {
    transform: translateX(20px);
}

.slider.round {
    border-radius: 24px;
}

.slider.round:before {
    border-radius: 50%;
}

#api-key-panel, #custom-api-panel {
    flex-direction: column;
    align-items: flex-start;
    width: 100%;
    /* 删除 margin-top: 5px; - 使用 .service-card-body 的 gap: 8px 统一控制间距 */
}

#custom-api-panel {
    display: none;
}

#api-key-panel.visible, #custom-api-panel.visible {
    display: block;
}

/* 删除 #api-key-panel label 的特殊样式 - 让它使用统一的 .setting-row > label 样式 */
/* 只保留 #custom-api-panel 的垂直布局样式（因为它确实需要label在上，input在下） */
#custom-api-panel label {
    margin-bottom: 5px;
    display: block;
    color: #aaa;
    font-size: 0.9em;
    flex-basis: auto;
    margin-right: 0;
}

input[type="text"], textarea {
    width: 100%;
    padding: 8px;
    background-color: #333;
    color: #fff;
    border: 1px solid #555;
    border-radius: 4px;
    font-size: 0.9em;
    margin-bottom: 10px;
    box-sizing: border-box;
}

input[type="text"]:focus, textarea:focus {
    outline: none;
    border: 1px solid #fff;
}

textarea {
    max-height: 100px;
    font-family: monospace;
    resize: vertical;
}

.test-api-container {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    margin-top: 5px;
    margin-bottom: 20px;
}

.test-button-container {
    width: 100%;
    margin-bottom: 5px;
    display: flex;
    flex-direction: column;
    gap: 8px;
}

.test-result-container {
    width: 100%;
    min-height: 20px;
}

.test-button {
    background-color: #2196F3;
    color: white;
    border: none;
    border-radius: 4px;
    padding: 8px 15px;
    cursor: pointer;
    font-size: 0.9em;
    transition: background-color 0.2s;
    width: 100%;
}

.test-button:hover {
    background-color: #0d6efd;
}

.test-button:active {
    background-color: #0a58ca;
}

.test-button.loading {
    background-color: #666;
    cursor: wait;
}

.test-result {
    margin-left: 10px;
    font-size: 0.9em;
}

.test-result.success {
    color: #4caf50;
}

.test-result.error {
    color: #f44336;
}

.test-tip {
    font-size: 0.8em;
    color: #888;
    margin: 0;
    text-align: center;
}

.api-info {
    margin-top: 5px;
    font-size: 0.8em;
}

.api-info a {
    color: #3ea6ff;
    text-decoration: none;
}

.api-info a:hover {
    text-decoration: underline;
}

.radio-group {
    display: flex;
    gap: 15px;
    margin-top: 5px;
}

.radio-option {
    display: flex;
    align-items: center;
    cursor: pointer;
    user-select: none;
}

.radio-option input[type="radio"] {
    margin-right: 5px;
    accent-color: #2196F3;
}

.radio-option span {
    font-size: 0.9em;
}

#membership-panel {
    flex-direction: column;
    align-items: flex-start;
}

#membership-panel label {
    margin-bottom: 5px;
    display: block;
    color: #aaa;
    font-size: 0.9em;
    flex-basis: auto;
    margin-right: 0;
}

input[type="password"] {
    width: 100%;
    padding: 8px;
    background-color: #333;
    color: #fff;
    border: 1px solid #555;
    border-radius: 4px;
    font-size: 0.9em;
    margin-bottom: 10px;
    box-sizing: border-box;
}

input[type="password"]:focus {
    outline: none;
    border: 1px solid #fff;
}

.button-container {
    width: 100%;
    display: flex;
    align-items: center;
    margin-bottom: 10px;
}

.action-button {
    background-color: #2196F3;
    color: white;
    border: none;
    border-radius: 4px;
    padding: 8px 15px;
    font-size: 0.9em;
    cursor: pointer;
    transition: background-color 0.3s;
}

.action-button:hover {
    background-color: #0d6efd;
}

.action-button:active {
    background-color: #0a58ca;
}

.action-button.loading {
    background-color: #666;
    cursor: wait;
}

.result-text {
    margin-left: 10px;
    font-size: 0.9em;
}

.result-text.success {
    color: #4caf50;
}

.result-text.error {
    color: #f44336;
}

/* 折叠动画规则 - 只用于需要折叠展开的面板 */
#service-type-panel, #membership-panel, #custom-api-panel {
    max-height: 0;
    overflow: hidden;
    transition: max-height 0.3s ease-out, opacity 0.3s ease-out, margin 0.3s ease-out;
    opacity: 0;
    margin-top: 0;
    margin-bottom: 0;
}

#service-type-panel.visible, #membership-panel.visible, #custom-api-panel.visible {
    max-height: 500px;
    opacity: 1;
    margin-top: 10px;
    margin-bottom: 20px;
}

/* #api-key-panel 不使用折叠动画，使用简单的 display 切换，间距由 .service-card-body 的 gap: 8px 统一控制 */

.login-title {
    font-size: 0.9em;
    color: #aaa;
    margin-top: 0;
    margin-bottom: 10px;
}

.social-login-container {
    display: flex;
    flex-direction: column;
    gap: 8px;
    width: 100%;
    margin-bottom: 15px;
}

.social-login-btn {
    display: flex;
    align-items: center;
    justify-content: flex-start;
    width: 100%;
    padding: 8px 12px;
    border-radius: 4px;
    border: 1px solid #555;
    background-color: #333;
    color: white;
    font-size: 0.9em;
    cursor: pointer;
    transition: all 0.2s ease;
}

.social-login-btn:hover {
    background-color: #444;
    border-color: #777;
}

.social-login-btn svg {
    margin-right: 8px;
}

.social-login-btn span {
    white-space: nowrap;
}

.google-btn:hover {
    background-color: rgba(234, 67, 53, 0.1);
}

.apple-btn:hover {
    background-color: rgba(255, 255, 255, 0.1);
}

.twitter-btn:hover {
    background-color: rgba(29, 161, 242, 0.1);
}

.facebook-btn:hover {
    background-color: rgba(24, 119, 242, 0.1);
}

.wechat-btn:hover {
    background-color: rgba(7, 193, 96, 0.1);
}

.login-status {
    width: 100%;
    text-align: center;
    margin-top: 5px;
}

.advanced-toggle {
    cursor: pointer;
    margin-bottom: 5px;
}

.advanced-toggle-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 5px 0;
    border-bottom: 1px solid #444;
}

.toggle-btn {
    background: none;
    border: none;
    color: #666;
    cursor: pointer;
    font-size: 14px;
    width: 24px;
    height: 24px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform 0.2s ease;
}

.toggle-btn.expanded .toggle-icon {
    transform: rotate(90deg);
}

.advanced-panel {
    margin-top: 0;
    padding-top: 5px;
    transition: max-height 0.3s ease, opacity 0.2s ease;
    overflow: hidden;
    max-height: 0;
    opacity: 0;
}

.advanced-panel.expanded {
    max-height: 1000px;
    opacity: 1;
}

.advanced-setting-item {
    margin-bottom: 15px;
    padding-left: 10px;
    border-left: 2px solid #555;
}

.setting-description {
    font-size: 12px;
    color: #888;
    margin-top: 2px;
}

.slider-container {
    display: flex;
    align-items: center;
    gap: 10px;
}

.slider-container input[type="range"] {
    flex: 1;
}

#openai-custom-model {
    margin-top: 5px;
    width: 100%;
}

#openai-basic-panel, #openai-advanced-toggle, #openai-advanced-panel {
    transition: opacity 0.3s ease, height 0.3s ease;
}

.ratelimit-panel {
    margin-top: 15px;
    padding: 10px;
    background-color: #2a2a2a;
    border-radius: 6px;
    border: 1px solid #444;
}

.ratelimit-panel h3 {
    margin-top: 0;
    margin-bottom: 10px;
    font-size: 14px;
    color: #ddd;
}

.ratelimit-info {
    display: flex;
    flex-direction: column;
    gap: 8px;
}

.ratelimit-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 13px;
    padding: 3px 0;
}

.ratelimit-label {
    color: #999;
    font-weight: 500;
}

.ratelimit-value {
    font-weight: 600;
    color: #3ea6ff;
    font-family: 'Roboto Mono', monospace;
}

.ratelimit-value.warning {
    color: #f57c00;
}

.ratelimit-value.danger {
    color: #d32f2f;
}

.ratelimit-value.good {
    color: #388e3c;
}

.password-container {
    position: relative;
    display: flex;
    align-items: center;
    margin-bottom: 0;
    flex: 1;
}

.password-container input[type="password"],
.password-container input[type="text"] {
    width: 100%;
    padding-right: 40px;
    margin-bottom: 0;
}

.toggle-password {
    position: absolute;
    right: 8px;
    top: 50%;
    transform: translateY(-50%);
    background: none;
    border: none;
    cursor: pointer;
    color: #aaa;
    padding: 5px;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 1;
}

.toggle-password:hover {
    color: #fff;
}

.simple-setting-item {
    margin-top: 15px;
    padding: 10px;
    background-color: #2a2a2a;
    border-radius: 6px;
    border: 1px solid #444;
}

.simple-setting-item label {
    display: block;
    margin-bottom: 8px;
    font-weight: 500;
    color: #ddd;
}

body::-webkit-scrollbar,
.custom-select-panel::-webkit-scrollbar {
    width: 8px;
}

body::-webkit-scrollbar-track,
.custom-select-panel::-webkit-scrollbar-track {
    background: #2a2a2a;
}

body::-webkit-scrollbar-thumb,
.custom-select-panel::-webkit-scrollbar-thumb {
    background-color: #777;
    border-radius: 5px;
    border: 2px solid #2a2a2a;
}

body::-webkit-scrollbar-thumb:hover,
.custom-select-panel::-webkit-scrollbar-thumb:hover {
    background-color: #aaa;
}

.info-box {
    padding: 12px;
    background-color: #2a2a2a;
    border-radius: 6px;
    border: 1px solid #444;
    margin-top: 5px;
}

.info-box p {
    margin: 6px 0;
    font-size: 0.85em;
    line-height: 1.5;
    color: #ccc;
}

.info-box p:first-child {
    margin-top: 0;
}

.info-box p:last-child {
    margin-bottom: 0;
}

.info-box strong {
    color: #fff;
    font-weight: 600;
}

.info-box a {
    color: #3ea6ff;
    text-decoration: none;
}

.info-box a:hover {
    text-decoration: underline;
}
    </style>
</head>
<body>
    <h1>翻译设置</h1>

    <div class="setting-item">
        <div class="setting-row">
            <label for="source-language">源语言</label>
            <div class="setting-control">
                <div class="custom-select-container" id="source-language-container">
                    <div class="custom-select-trigger" id="source-language-trigger">
                        <span class="selected-value">选择语言...</span>
                        <span class="arrow">▼</span>
                    </div>
                    <div class="custom-select-panel" id="source-language-panel">
                        <input type="search" id="source-language-search" placeholder="搜索源语言...">
                        <div class="custom-select-options" id="source-language-options">
                            <!-- 语言选项将由JS动态添加 -->
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="setting-item">
        <div class="setting-row">
            <label for="target-language">目标语言</label>
            <div class="setting-control">
                <div class="custom-select-container" id="target-language-container">
                    <div class="custom-select-trigger" id="target-language-trigger">
                        <span class="selected-value">选择语言...</span>
                        <span class="arrow">▼</span>
                    </div>
                    <div class="custom-select-panel" id="target-language-panel">
                        <input type="search" id="target-language-search" placeholder="搜索语言...">
                        <div class="custom-select-options" id="target-language-options">
                            <!-- 语言选项将由JS动态添加 -->
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="setting-item">
        <div class="setting-row">
            <label for="subtitle-type-switch">字幕类型</label>
            <div class="setting-control">
                <div class="switch-container">
                    <span>仅目标语言</span>
                    <label class="switch">
                        <input type="checkbox" id="subtitle-type-switch">
                        <span class="slider round"></span>
                    </label>
                    <span>双语</span>
                </div>
            </div>
        </div>
    </div>

    <!-- 翻译服务选择 -->
    <div class="setting-item">
        <div class="setting-row">
            <label for="translation-api">翻译服务</label>
            <div class="setting-control">
                <select id="translation-api" name="translation-api">
                    <option value="google-free">Google翻译 (免费)</option>
                    <option value="microsoft-free">微软翻译 (免费)</option>
                    <!-- 自有API选项 -->
                    <option value="deepl">DeepL API</option>
                    <option value="deepseek">DeepSeek API</option>
                    <option value="gemini">Gemini API</option>
                    <option value="openai">OpenAI API</option>
                </select>
            </div>
        </div>
    </div>

    <div id="service-card" class="service-card">
        <div class="service-card-header">
            <span id="service-card-title" class="service-card-title">Google 翻译</span>
            <span id="service-card-badge" class="service-card-badge is-free">免费</span>
        </div>
        <div class="service-card-body">
    <!-- 固定布局：所有元素都存在，用 visibility 控制显示/隐藏 -->

    <!-- 行1：API密钥输入框 - 永远存在 -->
    <div id="api-key-panel" class="setting-item">
        <div class="setting-row">
            <label for="api-key">API 密钥</label>
            <div class="setting-control">
                <div class="password-container">
                    <input type="password" id="api-key" name="api-key" placeholder="输入API密钥...">
                    <button type="button" id="toggle-password" class="toggle-password">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" class="eye-open" style="display: none;">
                            <path fill="currentColor" d="M12,4.5C7,4.5,2.73,7.61,1,12c1.73,4.39,6,7.5,11,7.5s9.27-3.11,11-7.5c-1.73-4.39-6-7.5-11-7.5z M12,17 c-2.76,0-5-2.24-5-5s2.24-5,5-5s5,2.24,5,5S14.76,17,12,17z M12,9c-1.66,0-3,1.34-3,3s1.34,3,3,3s3-1.34,3-3S13.66,9,12,9z" />
                        </svg>
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" class="eye-closed">
                            <path fill="currentColor" d="M12,7c2.76,0,5,2.24,5,5c0,0.65-0.13,1.26-0.36,1.83l2.92,2.92c1.51-1.26,2.7-2.89,3.43-4.75 c-1.73-4.39-6-7.5-11-7.5c-1.4,0-2.74,0.25-3.98,0.7l2.16,2.16C10.74,7.13,11.35,7,12,7z M2,4.27l2.28,2.28l0.46,0.46 C3.08,8.3,1.78,10.02,1,12c1.73,4.39,6,7.5,11,7.5c1.55,0,3.03-0.3,4.38-0.84l0.42,0.42L19.73,22L21,20.73L3.27,3L2,4.27z M7.53,9.8l1.55,1.55c-0.05,0.21-0.08,0.43-0.08,0.65c0,1.66,1.34,3,3,3c0.22,0,0.44-0.03,0.65-0.08l1.55,1.55 c-0.67,0.33-1.41,0.53-2.2,0.53c-2.76,0-5-2.24-5-5c0-0.79,0.2-1.53,0.53-2.2H7.53z M11.84,9.02l3.15,3.15l0.02-0.16 c0-1.66-1.34-3-3-3L11.84,9.02z" />
                        </svg>
                    </button>
                </div>
            </div>
        </div>
        <a href="#" id="api-info-link" target="_blank" class="setting-link">如何获取API密钥？</a>
    </div>

    <!-- 行2：模型选择 - 永远存在，包含所有服务的模型选择器 -->
    <div id="unified-model-panel" class="setting-item">
        <div class="setting-row">
            <label>模型</label>
            <div class="setting-control">
                <!-- OpenAI 模型选择 -->
                <select id="openai-model" name="openai-model" class="model-select" data-service="openai">
                    <option value="gpt-5">gpt-5 (旗舰)</option>
                    <option value="gpt-5-mini" selected>gpt-5-mini (推荐)</option>
                    <option value="gpt-5-nano">gpt-5-nano (极速)</option>
                </select>
                <!-- Gemini 模型选择 -->
                <select id="gemini-model" name="gemini-model" class="model-select" data-service="gemini">
                    <option value="gemini-2.5-flash">gemini-2.5-flash (标准)</option>
                    <option value="gemini-2.5-flash-lite" selected>gemini-2.5-flash-lite (快速·推荐)</option>
                </select>
                <!-- DeepL 模型选择 -->
                <select id="deepl-model" name="deepl-model" class="model-select" data-service="deepl">
                    <option value="latency_optimized" selected>latency_optimized (延迟优化·推荐)</option>
                    <option value="quality_optimized">quality_optimized (质量优化)</option>
                    <option value="prefer_quality_optimized">prefer_quality_optimized (偏好质量)</option>
                </select>
            </div>
        </div>
    </div>

    <!-- 行3：API类型（免费/付费切换）- 永远存在 -->
    <div id="unified-tier-panel" class="setting-item">
        <div class="setting-row">
            <label>API 类型</label>
            <div class="setting-control">
                <!-- Gemini tier 开关 -->
                <div class="switch-container tier-switch-container" data-service="gemini">
                    <span>免费</span>
                    <label class="switch">
                        <input type="checkbox" id="gemini-tier-switch">
                        <span class="slider round"></span>
                    </label>
                    <span>付费</span>
                </div>
                <!-- DeepL tier 开关 -->
                <div class="switch-container tier-switch-container" data-service="deepl">
                    <span>免费</span>
                    <label class="switch">
                        <input type="checkbox" id="deepl-tier-switch">
                        <span class="slider round"></span>
                    </label>
                    <span>付费</span>
                </div>
            </div>
        </div>
    </div>

    <!-- 修改：API测试按钮，新布局 -->
    <div class="setting-item test-api-container">
        <div class="test-button-container">
            <button id="test-api-key" class="test-button">测试连接</button>
            <p class="test-tip">点击测试将验证当前翻译服务的连接状态</p>
        </div>
        <div class="test-result-container">
            <span id="test-result" class="test-result"></span>
        </div>
    </div>

    <!-- 服务类型选择面板，默认隐藏 -->
    <div id="service-type-panel" class="setting-item" style="display: none;">
        <div class="setting-row">
            <label for="service-type">服务类型</label>
            <div class="setting-control">
                <div class="radio-group">
                    <label class="radio-option">
                        <input type="radio" name="service-type" value="membership" id="service-type-membership">
                        <span>会员账号</span>
                    </label>
                    <label class="radio-option">
                        <input type="radio" name="service-type" value="api-key" id="service-type-api-key">
                        <span>自有API密钥</span>
                    </label>
                </div>
            </div>
        </div>
    </div>

    <!-- 会员登录面板，默认隐藏 -->
    <div id="membership-panel" class="setting-item" style="display: none;">
        <p class="login-title">选择登录方式:</p>

                <span>谷歌账号</span>
            </button>
            <button class="social-login-btn apple-btn" data-provider="apple">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18"><path d="M17.05,20.28c-0.98,0.95-2.05,0.8-3.08,0.35c-1.09-0.46-2.09-0.48-3.24,0c-1.44,0.62-2.2,0.44-3.06-0.35 C2.79,15.25,3.51,7.59,9.05,7.31c1.35,0.07,2.29,0.74,3.08,0.8c1.18-0.2,2.3-0.88,3.46-0.75c1.47,0.17,2.58,0.8,3.3,1.98 c-3.03,1.83-2.24,5.75,0.73,6.89c-0.8,1.71-1.83,3.36-2.57,4.05z M13.91,4.78c-0.12,1.86,1.38,3.21,3.09,3.05 c0.12-1.77-1.39-3.16-3.09-3.05C10.86,4.78,13.91,4.78,13.91,4.78z" fill="#000"/></svg>

            </button>

            <span id="login-result" class="result-text"></span>
        </div>
    </div>

    <!-- 自定义API配置面板，默认隐藏 -->
    <div id="custom-api-panel" class="setting-item" style="display: none;">
        <label for="custom-api-url">API地址:</label>
        <input type="text" id="custom-api-url" name="custom-api-url" placeholder="https://your-api-endpoint.com">
        
        <label for="custom-api-method">请求方法:</label>
        <select id="custom-api-method" name="custom-api-method">
            <option value="POST">POST</option>
            <option value="GET">GET</option>
        </select>
        
        <label for="custom-api-headers">请求头 (JSON):</label>
        <textarea id="custom-api-headers" name="custom-api-headers" placeholder='{"Content-Type": "application/json"}'></textarea>
        
        <label for="custom-api-body">请求体格式 (JSON模板):</label>
        <textarea id="custom-api-body" name="custom-api-body" placeholder='{"text": "{text}", "source": "{source}", "target": "{target}"}'></textarea>
        
        <label for="custom-api-response-path">响应结果路径 (例如: "data.translations[0].text"):</label>
        <input type="text" id="custom-api-response-path" name="custom-api-response-path" placeholder="data.translations[0].text">
    </div>

        </div>
    </div>
