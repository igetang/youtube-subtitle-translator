<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>翻译设置</title>
    <script type="module" crossorigin src="./popup.ts"></script>
    <link rel="stylesheet" crossorigin href="../../assets/popup.css">
    <style>
        /* Popup特定样式调整 */
        body {
            width: 400px;
            min-height: 500px;
            max-height: 600px;
            overflow-y: auto;
            margin: 0;
            padding: 16px;
            box-sizing: border-box;
        }

        .setting-item {
            margin-bottom: 18px;
            flex-direction: column;
            align-items: stretch;
            gap: 8px;
        }

        .setting-row {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .setting-row > label {
            flex-basis: 78px;
            margin: 0;
            font-size: 0.9em;
            color: #c8d1dc;
            white-space: nowrap;
        }

        .setting-control {
            flex: 1;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .setting-control select,
        .setting-control input,
        .setting-control textarea {
            width: 100%;
        }

        .custom-select-container {
            flex: 1;
            max-width: 100%;
        }

        .switch-container {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .service-card {
            background: #101a2a;
            border: 1px solid #27354a;
            border-radius: 16px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .service-card-body {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .service-card .setting-item {
            margin-bottom: 0;
        }

        .service-card-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
        }

        .service-card-title {
            font-size: 0.95em;
            font-weight: 600;
        }

        .service-card-badge {
            padding: 2px 10px;
            border-radius: 999px;
            font-size: 0.75em;
            background: rgba(66, 133, 244, 0.18);
            color: #76a8ff;
        }

        .service-card-badge.is-free {
            background: rgba(16, 185, 129, 0.18);
            color: #32d296;
        }

        .password-container {
            width: 100%;
            margin: 0;
        }

        .password-container input[type="password"],
        .password-container input[type="text"] {
            padding-right: 40px;
            font-size: 0.9em;
        }

        .test-button-container {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .custom-select-panel {
            max-height: 300px !important;
            overflow-y: auto !important;
        }

        textarea {
            max-height: 100px;
            resize: vertical;
        }

        .social-login-container {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .social-login-btn {
            width: 100%;
            justify-content: flex-start;
        }
    </style>
</head>
<body>
    <h1>翻译设置</h1>

    <div class="setting-item">
        <div class="setting-row">
            <label for="source-language">源语言</label>
            <div class="setting-control">
                <div class="custom-select-container" id="source-language-container">
                    <div class="custom-select-trigger" id="source-language-trigger">
                        <span class="selected-value">选择语言...</span>
                        <span class="arrow">▼</span>
                    </div>
                    <div class="custom-select-panel" id="source-language-panel">
                        <input type="search" id="source-language-search" placeholder="搜索源语言...">
                        <div class="custom-select-options" id="source-language-options">
                            <!-- 语言选项将由JS动态添加 -->
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="setting-item">
        <div class="setting-row">
            <label for="target-language">目标语言</label>
            <div class="setting-control">
                <div class="custom-select-container" id="target-language-container">
                    <div class="custom-select-trigger" id="target-language-trigger">
                        <span class="selected-value">选择语言...</span>
                        <span class="arrow">▼</span>
                    </div>
                    <div class="custom-select-panel" id="target-language-panel">
                        <input type="search" id="target-language-search" placeholder="搜索语言...">
                        <div class="custom-select-options" id="target-language-options">
                            <!-- 语言选项将由JS动态添加 -->
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="setting-item">
        <div class="setting-row">
            <label for="subtitle-type-switch">字幕类型</label>
            <div class="setting-control">
                <div class="switch-container">
                    <span>仅目标语言</span>
                    <label class="switch">
                        <input type="checkbox" id="subtitle-type-switch">
                        <span class="slider round"></span>
                    </label>
                    <span>双语</span>
                </div>
            </div>
        </div>
    </div>

    <!-- 翻译服务选择 -->
    <div class="setting-item">
        <div class="setting-row">
            <label for="translation-api">翻译服务</label>
            <div class="setting-control">
                <select id="translation-api" name="translation-api">
                    <option value="google-free">Google翻译 (免费)</option>
                    <option value="microsoft-free">微软翻译 (免费)</option>
                    <!-- 自有API选项 -->
                    <option value="deepl">DeepL API</option>
                    <option value="deepseek">DeepSeek API</option>
                    <option value="gemini">Gemini API</option>
                    <option value="openai">OpenAI API</option>
                </select>
            </div>
        </div>
    </div>

    <div id="service-card" class="service-card">
        <div class="service-card-header">
            <span id="service-card-title" class="service-card-title">Google 翻译</span>
            <span id="service-card-badge" class="service-card-badge is-free">免费</span>
        </div>
        <div class="service-card-body">
    <!-- API密钥输入框 - 确保显示 -->
    <div id="api-key-panel" class="setting-item" style="display: none;">
        <div class="setting-row">
            <label for="api-key">API 密钥</label>
            <div class="setting-control">
                <div class="password-container">
                    <input type="password" id="api-key" name="api-key" placeholder="输入API密钥...">
                    <button type="button" id="toggle-password" class="toggle-password">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" class="eye-open" style="display: none;">
                            <path fill="currentColor" d="M12,4.5C7,4.5,2.73,7.61,1,12c1.73,4.39,6,7.5,11,7.5s9.27-3.11,11-7.5c-1.73-4.39-6-7.5-11-7.5z M12,17 c-2.76,0-5-2.24-5-5s2.24-5,5-5s5,2.24,5,5S14.76,17,12,17z M12,9c-1.66,0-3,1.34-3,3s1.34,3,3,3s3-1.34,3-3S13.66,9,12,9z" />
                        </svg>
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" class="eye-closed">
                            <path fill="currentColor" d="M12,7c2.76,0,5,2.24,5,5c0,0.65-0.13,1.26-0.36,1.83l2.92,2.92c1.51-1.26,2.7-2.89,3.43-4.75 c-1.73-4.39-6-7.5-11-7.5c-1.4,0-2.74,0.25-3.98,0.7l2.16,2.16C10.74,7.13,11.35,7,12,7z M2,4.27l2.28,2.28l0.46,0.46 C3.08,8.3,1.78,10.02,1,12c1.73,4.39,6,7.5,11,7.5c1.55,0,3.03-0.3,4.38-0.84l0.42,0.42L19.73,22L21,20.73L3.27,3L2,4.27z M7.53,9.8l1.55,1.55c-0.05,0.21-0.08,0.43-0.08,0.65c0,1.66,1.34,3,3,3c0.22,0,0.44-0.03,0.65-0.08l1.55,1.55 c-0.67,0.33-1.41,0.53-2.2,0.53c-2.76,0-5-2.24-5-5c0-0.79,0.2-1.53,0.53-2.2H7.53z M11.84,9.02l3.15,3.15l0.02-0.16 c0-1.66-1.34-3-3-3L11.84,9.02z" />
                        </svg>
                    </button>
                </div>
                <a href="#" id="api-info-link" target="_blank" class="setting-link">如何获取API密钥？</a>
            </div>
        </div>
    </div>

    <!-- OpenAI基础设置面板 -->
    <div id="openai-basic-panel" class="setting-item" style="display: none;">
        <div class="setting-row">
            <label for="openai-model">模型</label>
            <div class="setting-control">
                <select id="openai-model" name="openai-model">
                    <option value="gpt-5">gpt-5 (旗舰)</option>
                    <option value="gpt-5-mini" selected>gpt-5-mini (推荐)</option>
                    <option value="gpt-5-nano">gpt-5-nano (极速)</option>
                </select>
            </div>
        </div>
    </div>

    <!-- Gemini基础设置面板 (Phase 1: 手动tier选择) -->
    <div id="gemini-basic-panel" class="setting-item" style="display: none;">
        <div class="setting-row">
            <label for="gemini-model">模型</label>
            <div class="setting-control">
                <select id="gemini-model" name="gemini-model">
                    <option value="gemini-2.5-flash">gemini-2.5-flash (标准)</option>
                    <option value="gemini-2.5-flash-lite" selected>gemini-2.5-flash-lite (快速·推荐)</option>
                </select>
            </div>
        </div>

        <div class="setting-row">
            <label>API 类型</label>
            <div class="setting-control">
                <div class="switch-container">
                    <span>免费</span>
                    <label class="switch">
                        <input type="checkbox" id="gemini-tier-switch">
                        <span class="slider round"></span>
                    </label>
                    <span>付费</span>
                </div>
            </div>
        </div>
    </div>

    <!-- DeepL基础设置面板 (Phase 1) -->
    <div id="deepl-basic-panel" class="setting-item" style="display: none;">
        <div class="setting-row">
            <label for="deepl-model">模型</label>
            <div class="setting-control">
                <select id="deepl-model" name="deepl-model">
                    <option value="latency_optimized" selected>latency_optimized (延迟优化·推荐)</option>
                    <option value="quality_optimized">quality_optimized (质量优化)</option>
                    <option value="prefer_quality_optimized">prefer_quality_optimized (偏好质量)</option>
                </select>
            </div>
        </div>

        <div class="setting-row">
            <label>API 类型</label>
            <div class="setting-control">
                <div class="switch-container">
                    <span>免费</span>
                    <label class="switch">
                        <input type="checkbox" id="deepl-tier-switch">
                        <span class="slider round"></span>
                    </label>
                    <span>付费</span>
                </div>
            </div>
        </div>
    </div>

    <!-- 修改：API测试按钮，新布局 -->
    <div class="setting-item test-api-container">
        <div class="test-button-container">
            <button id="test-api-key" class="test-button">测试连接</button>
            <p class="test-tip">点击测试将验证当前翻译服务的连接状态</p>
        </div>
        <div class="test-result-container">
            <span id="test-result" class="test-result"></span>
        </div>
    </div>

    <!-- 服务类型选择面板，默认隐藏 -->
    <div id="service-type-panel" class="setting-item" style="display: none;">
        <div class="setting-row">
            <label for="service-type">服务类型</label>
            <div class="setting-control">
                <div class="radio-group">
                    <label class="radio-option">
                        <input type="radio" name="service-type" value="membership" id="service-type-membership">
                        <span>会员账号</span>
                    </label>
                    <label class="radio-option">
                        <input type="radio" name="service-type" value="api-key" id="service-type-api-key">
                        <span>自有API密钥</span>
                    </label>
                </div>
            </div>
        </div>
    </div>

    <!-- 会员登录面板，默认隐藏 -->
    <div id="membership-panel" class="setting-item" style="display: none;">
        <p class="login-title">选择登录方式:</p>
        <div class="social-login-container">
            <button class="social-login-btn google-btn" data-provider="google">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18"><path fill="#EA4335" d="M5.266,9.765A7.077,7.077,0,0,1,12,4.909c1.69,0,3.218,0.6,4.418,1.582L19.91,3C17.782,1.145,15.065,0,12,0 C7.27,0,3.198,2.698,1.24,6.65l4.026,3.115Z"/><path fill="#34A853" d="M16.04,18.013c-1.09,0.703-2.474,1.078-4.04,1.078c-3.234,0-5.99-2.104-6.723-4.823l-4.04,3.067 A11.965,11.965,0,0,0,12,24c2.933,0,5.735-1.043,7.834-3l-3.793-2.987Z"/><path fill="#4A90E2" d="M19.834,21c2.195-2.048,3.62-5.096,3.62-9c0-0.71-0.109-1.473-0.272-2.182H12v4.637h6.436 c-0.317,1.559-1.17,2.766-2.395,3.558L19.834,21Z"/><path fill="#FBBC05" d="M5.277,14.268C5.081,13.556,4.909,12.801,4.909,12c0-0.782,0.125-1.533,0.357-2.235L1.24,6.65 A11.934,11.934,0,0,0,0,12c0,1.92,0.445,3.73,1.237,5.335l4.04-3.067Z"/></svg>
                <span>谷歌账号</span>
            </button>
            <button class="social-login-btn apple-btn" data-provider="apple">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18"><path d="M17.05,20.28c-0.98,0.95-2.05,0.8-3.08,0.35c-1.09-0.46-2.09-0.48-3.24,0c-1.44,0.62-2.2,0.44-3.06-0.35 C2.79,15.25,3.51,7.59,9.05,7.31c1.35,0.07,2.29,0.74,3.08,0.8c1.18-0.2,2.3-0.88,3.46-0.75c1.47,0.17,2.58,0.8,3.3,1.98 c-3.03,1.83-2.24,5.75,0.73,6.89c-0.8,1.71-1.83,3.36-2.57,4.05z M13.91,4.78c-0.12,1.86,1.38,3.21,3.09,3.05 c0.12-1.77-1.39-3.16-3.09-3.05C10.86,4.78,13.91,4.78,13.91,4.78z" fill="#000"/></svg>
                <span>苹果账号</span>
            </button>
            <button class="social-login-btn twitter-btn" data-provider="twitter">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18"><path d="M18.244,2.25h3.308l-7.227,8.26l8.502,11.24H16.17l-5.214-6.817L4.99,21.75H1.68l7.73-8.835L1.254,2.25H8.08 l4.713,6.231L18.244,2.25z M17.083,19.77h1.833L7.084,4.126H5.117L17.083,19.77z" fill="#1DA1F2"/></svg>
                <span>推特账号</span>
            </button>
            <button class="social-login-btn facebook-btn" data-provider="facebook">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18"><path d="M24,12.073c0-6.627-5.373-12-12-12s-12,5.373-12,12c0,5.99,4.388,10.954,10.125,11.854v-8.385H7.078v-3.47h3.047V9.43 c0-3.007,1.792-4.669,4.533-4.669c1.312,0,2.686,0.235,2.686,0.235v2.953H15.83c-1.491,0-1.956,0.925-1.956,1.874v2.25h3.328 l-0.532,3.47h-2.796v8.385C19.612,23.027,24,18.062,24,12.073z" fill="#1877F2"/></svg>
                <span>脸书账号</span>
            </button>
            <button class="social-login-btn wechat-btn" data-provider="wechat">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18"><path d="M8.691,2.188C3.891,2.188,0,5.476,0,9.53c0,2.212,1.17,4.203,3.002,5.55c0.131,0.096,0.218,0.247,0.213,0.665 l0.39,1.48c-0.019,0.07-0.048,0.141-0.048,0.213c0,0.163,0.13,0.295,0.295,0.295c0.067,0,0.132-0.023,0.186-0.059l2.114-1.23 c0.113-0.066,0.243-0.101,0.376-0.097c0.092,0,0.165,0.019,0.236,0.039c0.882,0.246,1.782,0.376,2.712,0.376 c0.33,0,0.656-0.019,0.978-0.057c-0.978-2.953,0.99-5.661,4.21-6.604c1.29-0.38,2.712-0.376,4.002,0.058 C17.351,5.836,13.46,2.53,8.691,2.53L8.691,2.188z M19.263,9.548c0-0.749-0.61-1.36-1.36-1.36c-0.748,0-1.36,0.611-1.36,1.36 c0,0.749,0.612,1.36,1.36,1.36C18.653,10.908,19.263,10.297,19.263,9.548L19.263,9.548z M13.463,9.548c0-0.749-0.61-1.36-1.36-1.36 c-0.748,0-1.359,0.611-1.359,1.36c0,0.749,0.61,1.36,1.36,1.36C12.853,10.908,13.463,10.297,13.463,9.548L13.463,9.548z M24,14.471c0-3.423-3.334-6.206-7.44-6.206c-4.109,0-7.442,2.783-7.442,6.206c0,3.424,3.333,6.206,7.442,6.206 c0.843,0,1.666-0.14,2.423-0.376c0.053-0.022,0.111-0.037,0.165-0.037c0.129,0,0.258,0.033,0.376,0.097l1.853,1.08 c0.054,0.036,0.122,0.056,0.186,0.056c0.16,0,0.29-0.13,0.29-0.294c0-0.07-0.03-0.141-0.048-0.213l-0.342-1.295 c-0.068-0.266,0.005-0.548,0.213-0.664C22.841,18.631,24,16.656,24,14.471L24,14.471z M14.018,15.151 c-0.61,0-1.104-0.494-1.104-1.103c0-0.61,0.494-1.104,1.104-1.104c0.609,0,1.103,0.494,1.103,1.104 C15.121,14.657,14.627,15.151,14.018,15.151L14.018,15.151z M18.908,15.151c-0.61,0-1.104-0.494-1.104-1.103 c0-0.61,0.494-1.104,1.104-1.104c0.609,0,1.103,0.494,1.103,1.104C20.011,14.657,19.517,15.151,18.908,15.151L18.908,15.151z" fill="#07C160"/></svg>
                <span>微信账号</span>
            </button>
        </div>
        <div class="login-status">
            <span id="login-result" class="result-text"></span>
        </div>
    </div>

    <!-- 自定义API配置面板，默认隐藏 -->
    <div id="custom-api-panel" class="setting-item" style="display: none;">
        <label for="custom-api-url">API地址:</label>
        <input type="text" id="custom-api-url" name="custom-api-url" placeholder="https://your-api-endpoint.com">
        
        <label for="custom-api-method">请求方法:</label>
        <select id="custom-api-method" name="custom-api-method">
            <option value="POST">POST</option>
            <option value="GET">GET</option>
        </select>
        
        <label for="custom-api-headers">请求头 (JSON):</label>
        <textarea id="custom-api-headers" name="custom-api-headers" placeholder='{"Content-Type": "application/json"}'></textarea>
        
        <label for="custom-api-body">请求体格式 (JSON模板):</label>
        <textarea id="custom-api-body" name="custom-api-body" placeholder='{"text": "{text}", "source": "{source}", "target": "{target}"}'></textarea>
        
        <label for="custom-api-response-path">响应结果路径 (例如: "data.translations[0].text"):</label>
        <input type="text" id="custom-api-response-path" name="custom-api-response-path" placeholder="data.translations[0].text">
    </div>

        </div>
    </div>

    <!-- 可以添加保存按钮等 -->
    <!-- <button id="save-settings">保存设置</button> -->
 
</body>
</html>
